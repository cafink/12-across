<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12 Across</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/ui.js"></script>
</head>
<body>
  <main>
    <h1>12 Across</h1>
    <div class="notices">
      <p id="status">Loading words…</p>
      <p id="message" role="status"></p>
    </div>
    <div id="board" role="group" aria-label="Board"></div>
    <div id="rack" role="group" aria-label="Rack"></div>
    <div class="buttons">
      <button id="new-game" type="button" disabled>New Game</button>
      <button id="clear-board" type="button" disabled>Clear Board</button>
    </div>
  </main>
</body>
</html>
